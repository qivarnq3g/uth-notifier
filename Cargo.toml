[workspace]
members = [
    "apps/edge-worker",
    "apps/core-agent",
    "crates/classifier",
    "crates/crawler",
    "crates/delivery",
    "crates/domain",
    "crates/storage",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["brotli", "charset", "gzip", "http2", "json", "multipart", "rustls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
png = "0.18"
qrcode = { version = "0.14", default-features = false }
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "process", "rt", "signal", "sync", "time"] }
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
